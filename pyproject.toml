[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vjepa2-ttnn"
version = "0.2.0"
description = "V-JEPA2-AC action-conditioned world model on Tenstorrent Blackhole via TTNN. A development install of the tt/, gradio_app/ and service/ packages. The v6 thin bundle does not use this wheel: packaging/package-thin.sh ships a fixed list of these files as the bundle's extra_code. Does NOT include scripts/, docs/, or the vendored reference/ tree."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["tt*", "gradio_app*", "service*"]
