[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vjepa2-ttnn"
version = "0.1.0"
description = "V-JEPA2-AC action-conditioned world model on Tenstorrent Blackhole via TTNN. `uv build` here packages the served-path closure -- service/ (the ASGI app), gradio_app/'s backend + planning modules, and tt/'s encoder+predictor -- plus each package's own tests, mirroring waypoint-ttnn's precedent of shipping the full find()-based tree rather than a hand-curated subset. Does NOT include scripts/, docs/, or the vendored reference/ tree (Meta's own repo, used only by ReferenceBackend for local CPU comparison, never by the served TTNN path)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["tt*", "gradio_app*", "service*"]
